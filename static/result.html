<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索结果 - B2B 客户开发工具</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --success: #059669;
      --danger: #dc2626;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1600px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 1800px) { .container { max-width: 1760px; } }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .header h1 { font-size: 22px; }
    .header .meta { color: var(--muted); font-size: 14px; }
    .back-btn {
      display: inline-block;
      padding: 8px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }
    .back-btn:hover { border-color: var(--primary); }
    .export-btn {
      display: inline-block;
      padding: 8px 16px;
      background: var(--success);
      border: none;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .export-btn:hover { opacity: 0.9; }
    .verify-btn {
      display: inline-block;
      padding: 8px 16px;
      background: #f59e0b;
      border: none;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 8px;
    }
    .verify-btn:hover { opacity: 0.9; }
    .verify-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .verify-status {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
    }
    .filter-bar input {
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      min-width: 220px;
    }
    .filter-bar input:focus { border-color: var(--primary); }
    .filter-bar button {
      padding: 8px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }
    .filter-bar button.primary { background: var(--primary); color: #fff; border: none; font-weight: 600; }
    .filter-bar button:hover { opacity: 0.9; }
    .filter-info { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .position-tags {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .position-tag {
      padding: 6px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .position-tag:hover { border-color: var(--primary); }
    .position-tag.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }
    .position-tag .count {
      color: var(--muted);
      font-size: 12px;
      margin-left: 4px;
    }
    .desc-tooltip {
      display: inline-block;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: #475569;
      cursor: help;
      border-bottom: 1px dashed #cbd5e1;
    }
    .desc-preview {
      position: relative;
      display: inline-block;
    }
    .desc-preview .preview-card {
      display: none;
      position: fixed;
      z-index: 100;
      width: 320px;
      max-width: 90vw;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      white-space: normal;
      text-align: left;
    }
    .desc-preview:hover .preview-card {
      display: block;
    }
    .preview-card .preview-title {
      font-weight: 700;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .preview-card .preview-text {
      color: #334155;
    }
    .preview-card .preview-meta {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .position-tag.active .count { color: rgba(255,255,255,0.85); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th:last-child, td:last-child {
      white-space: normal;
      min-width: 180px;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    th.sortable {
      cursor: pointer;
      user-select: none;
    }
    th.sortable:hover { color: var(--primary); }
    th.sortable .sort-arrow {
      margin-left: 4px;
      font-size: 11px;
      color: var(--primary);
    }
    td { vertical-align: middle; }
    tr:hover td { background: rgba(56,189,248,0.05); }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-new { background: rgba(5,150,105,0.12); color: #047857; }
    .status-sent { background: rgba(2,132,199,0.10); color: #0369a1; }
    .status-replied { background: rgba(217,119,6,0.12); color: #b45309; }
    .status-quoted { background: rgba(37,99,235,0.10); color: #1d4ed8; }
    .status-negotiating { background: rgba(234,88,12,0.10); color: #c2410c; }
    .status-won { background: rgba(5,150,105,0.15); color: #047857; }
    .status-lost { background: rgba(100,116,139,0.12); color: #475569; }
    .tier-a { background: rgba(5,150,105,0.12); color: #047857; }
    .tier-b { background: rgba(2,132,199,0.10); color: #0369a1; }
    .tier-c { background: rgba(100,116,139,0.12); color: #475569; }
    .btn-sm {
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 4px;
      margin-bottom: 4px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-success { background: var(--success); color: #fff; }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .pagination button {
      padding: 8px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }
    .pagination button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .error-box {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      color: var(--danger);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h3 { font-size: 18px; }
    .close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
    }
    .sig-input {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .timeline { margin: 12px 0; }
    .timeline-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .timeline-time { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .timeline-action { font-weight: 600; font-size: 14px; }
    .timeline-notes { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .modal-footer button { width: 100%; padding: 12px; margin-top: 10px; }
    .email-modal {
      max-width: 680px;
    }
    .email-modal .sig-input,
    .email-modal textarea {
      font-family: inherit;
    }
    .email-modal textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.6;
    }
    .email-modal .field-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      display: block;
    }
    .email-modal .template-select {
      margin-bottom: 14px;
    }
    .email-modal .variable-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.5;
    }
    .email-modal .modal-footer {
      display: flex;
      gap: 10px;
    }
    .email-modal .modal-footer button {
      flex: 1;
      margin-top: 0;
    }
    .verify-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .verify-badge.ok { background: #dcfce7; color: #166534; }
    .verify-badge.bad { background: #fee2e2; color: #991b1b; }
    .verify-badge.unknown { background: #f1f5f9; color: #64748b; }
    .filter-bar label.checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-bar label.checkbox input { margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <a href="/" class="back-btn">← 返回首页</a>
        <h1 id="pageTitle">搜索结果</h1>
        <div class="meta" id="pageMeta"></div>
      </div>
      <div>
        <button class="verify-btn" id="verifyBtn" onclick="verifyLeads()" style="display:none;">批量验证</button>
        <button class="export-btn" id="exportBtn" onclick="exportExcel()" style="display:none;">导出 Excel</button>
      </div>
    </div>

    <div id="verifyStatus" class="verify-status" style="display:none;"></div>

    <div id="errorBox"></div>

    <div class="filter-bar" id="filterBar" style="display:none;">
      <input type="text" id="positionFilter" placeholder="输入职位关键词筛选，如 Buyer、Manager..." onkeydown="if(event.key==='Enter')applyFilter()">
      <label style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);white-space:nowrap;">
        关联度 ≥
        <input type="number" id="relevanceFilter" value="" min="-50" max="100" placeholder="不限" style="width:70px;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:14px;outline:none;">
      </label>
      <label class="checkbox"><input type="checkbox" id="filterDomainAlive"> 仅域名存活</label>
      <label class="checkbox"><input type="checkbox" id="filterCompanyActive"> 仅公司活跃</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);white-space:nowrap;">
        客户分层
        <select id="tierFilter" onchange="applyFilter()" style="padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:14px;outline:none;">
          <option value="">全部</option>
          <option value="A">A 核心大客户</option>
          <option value="B">B 潜力客户</option>
          <option value="C">C 低价值线索</option>
        </select>
      </label>
      <button class="primary" onclick="applyFilter()">筛选</button>
      <button onclick="clearFilter()">重置</button>
    </div>
    <div class="position-tags" id="positionTags"></div>
    <div class="filter-info" id="filterInfo" style="display:none;"></div>

    <div class="card" id="tableCard" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>邮箱</th>
            <th>姓名</th>
            <th class="sortable" onclick="sortBy('position')">职位<span id="sortPosition" class="sort-arrow"></span></th>
            <th class="sortable" onclick="sortBy('company')">公司<span id="sortCompany" class="sort-arrow"></span></th>
            <th>电话</th>
            <th>域名</th>
            <th>来源</th>
            <th>网站简介</th>
            <th class="sortable" onclick="sortBy('tier')">客户分层<span id="sortTier" class="sort-arrow"></span></th>
            <th>关联度</th>
            <th>LinkedIn</th>
            <th>置信度</th>
            <th>域名状态</th>
            <th>公司状态</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>

    <div class="empty" id="emptyState" style="display:none;">加载中...</div>
  </div>

  <!-- Contact Detail Modal -->
  <div class="modal-overlay" id="contactModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">客户详情</h3>
        <button class="close-btn" onclick="closeContactModal()">×</button>
      </div>
      <div id="modalBody"></div>
      <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px;">
        <label style="font-size:12px;color:var(--muted);">状态</label>
        <select id="followupAction" class="sig-input">
          <option value="已发邮件">已发邮件</option>
          <option value="已回复">已回复</option>
          <option value="已报价">已报价</option>
          <option value="谈判中">谈判中</option>
          <option value="成交">成交</option>
          <option value="放弃">放弃</option>
        </select>
        <label style="font-size:12px;color:var(--muted);">备注</label>
        <textarea id="followupNotes" rows="3" class="sig-input" style="resize:vertical;"></textarea>
        <label style="font-size:12px;color:var(--muted);">下次跟进时间</label>
        <input type="date" id="followupDate" class="sig-input">
        <button class="btn-primary" style="width:100%;padding:12px;" onclick="submitFollowup()">保存跟进</button>
      </div>
    </div>
  </div>

  <!-- Email Template Modal -->
  <div class="modal-overlay" id="emailTemplateModal">
    <div class="modal email-modal">
      <div class="modal-header">
        <h3>发送邮件</h3>
        <button class="close-btn" onclick="closeEmailTemplateModal()">×</button>
      </div>
      <div>
        <label class="field-label">收件人</label>
        <input type="text" id="emailTo" class="sig-input" readonly>

        <label class="field-label">发件人信息（自动填入模板）</label>
        <div style="display:flex;gap:10px;">
          <input type="text" id="emailMyName" class="sig-input" placeholder="你的名字" style="flex:1;">
          <input type="text" id="emailMyCompany" class="sig-input" placeholder="你的公司" style="flex:1;">
        </div>

        <label class="field-label">选择模板</label>
        <select id="emailTemplateSelect" class="sig-input template-select" onchange="onEmailTemplateChange()">
          <option value="intro">初次合作开发信</option>
          <option value="product">产品推荐</option>
          <option value="followup">跟进邮件</option>
        </select>

        <label class="field-label">主题</label>
        <input type="text" id="emailSubject" class="sig-input">

        <label class="field-label">正文</label>
        <textarea id="emailBody" class="sig-input"></textarea>

        <p class="variable-hint">
          可用变量：{company} 公司名、{domain} 域名、{first_name} 名、{last_name} 姓、{position} 职位、{product} 产品词、{my_name} 你的名字、{my_company} 你的公司
        </p>

        <div class="modal-footer" style="margin-top:16px;">
          <button class="btn-sm btn-outline" style="padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;" onclick="closeEmailTemplateModal()">取消</button>
          <button class="btn-sm btn-success" style="padding:12px;border-radius:8px;border:none;background:var(--success);color:#fff;cursor:pointer;font-weight:600;" onclick="confirmSendEmail()">打开邮件客户端</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 20;
    let allLeads = [];
    let filteredLeads = [];
    let currentPage = 1;
    let searchMeta = {};
    let currentDetailEmail = null;
    let sortState = { column: null, direction: 'asc' };

    const POSITION_PRIORITY = [
      "Buyer", "Senior Buyer", "Purchasing Manager", "Procurement Manager",
      "Sourcing Manager", "Global Sourcing Manager", "Merchandiser",
      "Merchandising Manager", "Category Manager", "Product Category Manager",
      "Commercial Director", "Sales & Commercial Director", "Sales and Commercial Director",
      "Product Manager", "Product Development Manager", "Brand Manager",
      "Marketing Manager", "Operations Manager", "Supply Chain Manager",
      "General Manager", "Managing Director"
    ];

    const params = new URLSearchParams(location.search);
    const jobId = params.get('job_id');

    // Email templates for the lightweight mailto flow.
    const EMAIL_TEMPLATES = {
      intro: {
        name: '初次合作开发信',
        subject: 'Inquiry about {product} cooperation with {company}',
        body: `Hi {first_name},

I hope this email finds you well.

My name is {my_name} from {my_company}. We came across {company} while researching {product} suppliers/distributors and were impressed by your focus on this market.

We specialize in manufacturing high-quality {product} and are currently looking for reliable partners like {company} to expand our distribution network.

Would you be open to a quick call to discuss potential cooperation?

Best regards,
{my_name}
{my_company}`
      },
      product: {
        name: '产品推荐',
        subject: '{product} catalog for {company}',
        body: `Hi {first_name},

I hope you are doing well.

I am {my_name} from {my_company}. We are a professional manufacturer of {product} and would love to introduce our latest collection to {company}.

Could you please let me know if you are interested in receiving our catalog and price list?

Looking forward to hearing from you.

Best regards,
{my_name}
{my_company}`
      },
      followup: {
        name: '跟进邮件',
        subject: 'Follow-up: {product} inquiry for {company}',
        body: `Hi {first_name},

I hope all is well at {company}.

I wanted to follow up on my previous email regarding our {product}. I understand you are busy, but I would greatly appreciate any feedback or questions you may have.

Please let me know if there is a good time for a brief call.

Best regards,
{my_name}
{my_company}`
      }
    };
    let emailTemplateCurrentLead = null;

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function attrEscape(str) {
      return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Extract a product keyword from the search keyword (first 1-2 meaningful words).
    function extractProductKeyword(keyword) {
      if (!keyword) return 'our products';
      const cleaned = keyword.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
      const stopWords = new Set(['manufacturer', 'supplier', 'distributor', 'wholesaler', 'importer', 'exporter', 'dealer', 'reseller', 'buyer', 'retailer', 'oem', 'odm', 'company', 'factory', 'in', 'usa', 'us', 'uk', 'eu', 'europe', 'germany', 'japan', 'china']);
      const words = cleaned.split(' ').filter(w => w && !stopWords.has(w));
      if (!words.length) return cleaned || 'our products';
      // Prefer the first two meaningful words (e.g. "football gloves").
      return words.slice(0, 2).join(' ');
    }

    function fillEmailTemplate(template, lead, meta) {
      const myName = document.getElementById('emailMyName').value.trim();
      const myCompany = document.getElementById('emailMyCompany').value.trim();
      const product = extractProductKeyword(meta.keyword || lead.search_keyword || '');
      const firstName = lead.first_name || 'there';
      const lastName = lead.last_name || '';

      return template
        .replace(/\{company\}/g, lead.company || lead.domain || '')
        .replace(/\{domain\}/g, lead.domain || '')
        .replace(/\{first_name\}/g, firstName)
        .replace(/\{last_name\}/g, lastName)
        .replace(/\{position\}/g, lead.position || '')
        .replace(/\{product\}/g, product)
        .replace(/\{my_name\}/g, myName)
        .replace(/\{my_company\}/g, myCompany);
    }

    function openEmailTemplateModal(email) {
      const lead = allLeads.find(l => l.email === email);
      if (!lead || !lead.email) return;
      emailTemplateCurrentLead = lead;

      document.getElementById('emailTo').value = lead.email;

    function renderDescCell(row) {
      const text = row.website_description || '';

      let full = text;
      let short = text.length > 30 ? text.slice(0, 30) + '...' : text;

      // Enrich Google Maps results with address, rating, and Maps link.
      if (row.source_type === 'google_maps') {
        const parts = [];
        if (row.address) parts.push('📍 ' + row.address);
        if (row.google_rating) {
          const reviews = row.google_reviews_count ? ` (${row.google_reviews_count} 评论)` : '';
          parts.push('⭐ ' + row.google_rating + reviews);
        }
        if (row.google_maps_url) {
          parts.push(`<a href="${escapeHtml(row.google_maps_url)}" target="_blank" rel="noopener" style="color:#059669;">点击查看 Google Maps</a>`);
        }
        if (parts.length) {
          full = text ? text + '\n' + parts.join('\n') : parts.join('\n');
          short = text ? (text.length > 24 ? text.slice(0, 24) + '...' : text) : 'Maps 信息';
        }

      return `<span class="desc-preview">
        <span class="desc-tooltip">${escapeHtml(short)}</span>
        <div class="preview-card">

          <div class="preview-text">${escapeHtml(full).replace(/\n/g, '<br>')}</div>

    function verifyLeads() {
      if (!jobId) return;
      const btn = document.getElementById('verifyBtn');
      const status = document.getElementById('verifyStatus');
      btn.disabled = true;
      status.style.display = 'block';
      status.innerHTML = '验证中，请稍候...';

      const params = new URLSearchParams();
      params.append('job_id', jobId);
      params.append('verify_domain', 'true');
      params.append('verify_company', 'true');
      const streamUrl = `/api/leads/verify/stream?${params.toString()}`;

      const es = new EventSource(streamUrl);
      let lastMessageAt = Date.now();
      let slowShown = false;
      let timeoutShown = false;

      const activityTimer = setInterval(() => {
        const elapsed = Date.now() - lastMessageAt;
        if (!timeoutShown && elapsed > 60000) {
          timeoutShown = true;
          es.close();
          clearInterval(activityTimer);
          btn.disabled = false;
          status.innerHTML = `<span style="color:#dc2626">验证超时（超过 60 秒无响应）。</span>
            <button class="verify-btn" onclick="verifyLeads()">重新验证</button>`;
        } else if (!slowShown && elapsed > 15000) {
          slowShown = true;
          status.innerHTML = '验证仍在进行，请耐心等待...';
        }
      }, 2000);

      es.onmessage = (event) => {
        lastMessageAt = Date.now();
        slowShown = false;
        const data = JSON.parse(event.data);
        if (data.type === 'ping') return;
        if (data.type === 'log') {
          status.textContent = '验证中：' + data.content;
        } else if (data.type === 'done') {
          clearInterval(activityTimer);
          es.close();
          btn.disabled = false;
          if (data.status === 'success' && data.job_id) {
            status.innerHTML = `验证完成，新搜索 ID: ${escapeHtml(data.job_id)}，正在跳转...`;
            setTimeout(() => {
              location.href = '/result?job_id=' + encodeURIComponent(data.job_id);
            }, 800);
          } else {
            let title = '验证失败';
            if (data.error_type === 'timeout') title = '验证超时';
            else if (data.error_type === 'subprocess_error') title = '验证进程异常';
            else if (data.error_type === 'no_output') title = '无验证结果';
            status.innerHTML = `<span style="color:#dc2626">${escapeHtml(title)}：${escapeHtml(data.message || '未知错误')}</span>
              <button class="verify-btn" onclick="verifyLeads()">重新验证</button>`;
          }
        }
      };
      es.onerror = () => {
        clearInterval(activityTimer);
        es.close();
        btn.disabled = false;
        status.innerHTML = `<span style="color:#dc2626">连接已断开，请检查网络后重试。</span>
          <button class="verify-btn" onclick="verifyLeads()">重新验证</button>`;
      };
    }

    function showError(msg) {
      document.getElementById('errorBox').innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
      document.getElementById('emptyState').textContent = '加载失败';
      document.getElementById('emptyState').style.display = 'block';
    }

    function sortBy(column) {
      if (sortState.column === column) {
        sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
      } else {
        sortState.column = column;
        sortState.direction = 'asc';
      }
      currentPage = 1;
      updateSortIndicators();
      renderPage();
    }

    function updateSortIndicators() {
      document.getElementById('sortPosition').textContent = sortState.column === 'position' ? (sortState.direction === 'asc' ? ' ↑' : ' ↓') : '';
      document.getElementById('sortCompany').textContent = sortState.column === 'company' ? (sortState.direction === 'asc' ? ' ↑' : ' ↓') : '';
      const tierEl = document.getElementById('sortTier');
      if (tierEl) {
        tierEl.textContent = sortState.column === 'tier' ? (sortState.direction === 'asc' ? ' ↑' : ' ↓') : '';
      }
    }

    function isVerifyTrue(value) {
      if (value === true || value === 'true' || value === 'True' || value === 1 || value === '1') return true;
      if (value === false || value === 'false' || value === 'False' || value === 0 || value === '0' || value === '' || value === null || value === undefined) return false;
      return false;
    }

    function renderVerifyBadge(value, error) {
      const ok = isVerifyTrue(value);
      if (ok) return '<span class="verify-badge ok">正常</span>';
      if (value === '' || value === null || value === undefined || value === 'None') return '<span class="verify-badge unknown">未验证</span>';
      return `<span class="verify-badge bad" title="${attrEscape(error || '')}">异常</span>`;
    }

    function renderPage() {
      const start = (currentPage - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;

      let displayLeads = filteredLeads;
      if (sortState.column) {
        displayLeads = [...filteredLeads].sort((a, b) => {
          const va = (a[sortState.column] || '').toLowerCase();
          const vb = (b[sortState.column] || '').toLowerCase();
          if (va < vb) return sortState.direction === 'asc' ? -1 : 1;
          if (va > vb) return sortState.direction === 'asc' ? 1 : -1;
          return 0;
        });
      }
      const pageLeads = displayLeads.slice(start, end);
      const tbody = document.getElementById('tableBody');
      let html = '';
      for (const row of pageLeads) {
        const contacted = row.contacted;
        const badge = statusBadge(row.status || (contacted ? '已发邮件' : '未联系'));
        html += `<tr>` +
          `<td>${escapeHtml(row.email || '')}</td>` +
          `<td>${escapeHtml((row.first_name || '') + ' ' + (row.last_name || ''))}</td>` +
          `<td>${escapeHtml(row.position || '')}</td>` +
          `<td>${escapeHtml(row.company || '')} <a href="https://www.linkedin.com/search/results/companies/?keywords=${encodeURIComponent(row.company || row.domain || '')}" target="_blank" rel="noopener" title="LinkedIn 搜索公司" style="color:#0a66c2;font-size:11px;margin-left:4px;">[in]</a></td>` +
          `<td>${formatPhoneCell(row)}</td>` +
          `<td>${escapeHtml(row.domain || '')}</td>` +
          `<td>${sourceTypeLabel(row.source_type || '')}</td>` +
          `<td>${renderDescCell(row)}</td>` +
          `<td title="${escapeHtml(row.tier_reason || '')}">${tierBadge(row.tier || '')}</td>` +
          `<td>${escapeHtml(row.relevance_score !== undefined ? row.relevance_score : '')}</td>` +
          `<td>${row.linkedin_url ? `<a href="${escapeHtml(row.linkedin_url)}" target="_blank" rel="noopener noreferrer" style="color:#0a66c2;font-weight:500;">查看</a>` : ''}</td>` +
          `<td>${escapeHtml(row.confidence_score || '')}</td>` +
          `<td>${renderVerifyBadge(row.domain_alive, row.domain_check_error)}</td>` +
          `<td>${renderVerifyBadge(row.company_active, row.company_status_notes)}</td>` +
          `<td>${badge}</td>` +
          `<td>` +
            (row.email
              ? `<button class="btn-sm btn-outline" onclick="openEmailTemplateModal('${attrEscape(row.email)}')" style="cursor:pointer;">发邮件</button>`
              : `<span style="font-size:12px;color:var(--muted);">无邮箱</span>`) +
            (row.email
              ? (contacted
                  ? ` <button class="btn-sm btn-primary" onclick="openContactDetail('${escapeHtml(row.email)}')">跟进</button>`
                  : ` <button class="btn-sm btn-success" onclick="markContacted('${escapeHtml(row.email)}', '${escapeHtml(row.domain || '')}')">标记已联系</button>`)
              : '') +
          `</td>` +
        `</tr>`;
      }
      tbody.innerHTML = html;
      renderPagination();
      initTooltips();
    }

    function initTooltips() {
      const tbody = document.getElementById('tableBody');
      tbody.querySelectorAll('.desc-preview').forEach(el => {
        el.addEventListener('mouseenter', () => {
          const card = el.querySelector('.preview-card');
          if (!card) return;
          card.style.display = 'block';
          const rect = el.getBoundingClientRect();
          const cardRect = card.getBoundingClientRect();
          let top = rect.bottom + 8;
          let left = rect.left;
          // Place above if not enough space below
          if (top + cardRect.height > window.innerHeight - 20) {
            top = rect.top - cardRect.height - 8;
          }
          // Keep inside viewport horizontally
          if (left + cardRect.width > window.innerWidth - 20) {
            left = window.innerWidth - cardRect.width - 20;
          }
          if (left < 10) left = 10;
          card.style.top = top + 'px';
          card.style.left = left + 'px';
        });
        el.addEventListener('mouseleave', () => {
          const card = el.querySelector('.preview-card');
          if (card) card.style.display = 'none';
        });
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredLeads.length / PAGE_SIZE) || 1;
      const box = document.getElementById('pagination');
      if (totalPages <= 1) { box.innerHTML = ''; return; }

      let html = '';
      html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">上一页</button>`;

      const maxVisible = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
      let endPage = Math.min(totalPages, startPage + maxVisible - 1);
      if (endPage - startPage + 1 < maxVisible) {
        startPage = Math.max(1, endPage - maxVisible + 1);
      }

      if (startPage > 1) html += `<button onclick="goPage(1)">1</button>${startPage > 2 ? '<span style="color:var(--muted);padding:0 4px;">...</span>' : ''}`;
      for (let i = startPage; i <= endPage; i++) {
        html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      if (endPage < totalPages) html += `${endPage < totalPages - 1 ? '<span style="color:var(--muted);padding:0 4px;">...</span>' : ''}<button onclick="goPage(${totalPages})">${totalPages}</button>`;

      html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">下一页</button>`;
      box.innerHTML = html;
    }

    function goPage(p) {
      const totalPages = Math.ceil(filteredLeads.length / PAGE_SIZE) || 1;
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function markContacted(email, domain) {
      if (!email) { alert('该客户没有邮箱，无法标记'); return; }
      try {
        const lead = allLeads.find(l => l.email === email) || {};
        const form = new FormData();
        form.append('email', email);
        form.append('domain', domain || '');
        form.append('notes', '');
        form.append('org_structure_type', lead.org_structure_type || '');
        form.append('parent_company_name', lead.parent_company_name || '');
        form.append('parent_company_country', lead.parent_company_country || lead.hq_country || '');
        form.append('hq_country', lead.hq_country || lead.parent_company_country || '');
        form.append('purchasing_authority', lead.purchasing_authority || '');
        form.append('purchasing_authority_reason', lead.purchasing_authority_reason || '');
        form.append('parent_org_data_source', lead.parent_org_data_source || '');
        const res = await fetch('/api/contacted', { method: 'POST', body: form });
        if (res.ok) {
          if (lead.email) { lead.contacted = true; lead.status = '已发邮件'; }
          const fLead = filteredLeads.find(l => l.email === email);
          if (fLead) { fLead.contacted = true; fLead.status = '已发邮件'; }
          renderPage();
          openContactDetail(email);
        } else {
          alert('标记失败');
        }
      } catch (err) {
        alert('标记失败');
      }
    }

    function applyFilter() {
      const posFilter = document.getElementById('positionFilter').value.trim().toLowerCase();
      const relFilter = document.getElementById('relevanceFilter').value;
      const relMin = relFilter === '' ? null : parseFloat(relFilter);
      const domainAliveOnly = document.getElementById('filterDomainAlive').checked;
      const companyActiveOnly = document.getElementById('filterCompanyActive').checked;
      const tierFilter = document.getElementById('tierFilter').value;

      filteredLeads = allLeads.slice();
      if (posFilter) {
        filteredLeads = filteredLeads.filter(l => (l.position || '').toLowerCase().includes(posFilter));
      }
      if (relMin !== null && !isNaN(relMin)) {
        filteredLeads = filteredLeads.filter(l => (l.relevance_score || 0) >= relMin);
      }
      if (domainAliveOnly) {
        filteredLeads = filteredLeads.filter(l => isVerifyTrue(l.domain_alive));
      }
      if (companyActiveOnly) {
        filteredLeads = filteredLeads.filter(l => isVerifyTrue(l.company_active));
      }
      if (tierFilter) {
        filteredLeads = filteredLeads.filter(l => (l.tier || '') === tierFilter);
      }
      if (!posFilter && relMin === null && !domainAliveOnly && !companyActiveOnly && !tierFilter) {
        clearFilter();
        return;
      }
      currentPage = 1;
      const parts = [];
      if (posFilter) parts.push(`职位："${posFilter}"`);
      if (relMin !== null) parts.push(`关联度 ≥ ${relMin}`);
      if (domainAliveOnly) parts.push('域名存活');
      if (companyActiveOnly) parts.push('公司活跃');
      if (tierFilter) {
        const tierLabelMap = { A: 'A 核心大客户', B: 'B 潜力客户', C: 'C 低价值线索' };
        parts.push(`客户分层：${tierLabelMap[tierFilter] || tierFilter}`);
      }
      document.getElementById('filterInfo').textContent = parts.join(' · ') + ` · 共 ${filteredLeads.length} 条结果`;
      document.getElementById('filterInfo').style.display = 'block';
      renderPage();
      renderPositionTags();
    }

    function clearFilter() {
      document.getElementById('positionFilter').value = '';
      document.getElementById('relevanceFilter').value = '';
      document.getElementById('filterDomainAlive').checked = false;
      document.getElementById('filterEmailValid').checked = false;
      document.getElementById('filterCompanyActive').checked = false;
      document.getElementById('tierFilter').value = '';
      filteredLeads = allLeads.slice();
      currentPage = 1;
      document.getElementById('filterInfo').style.display = 'none';
      renderPage();
      renderPositionTags();
    }

    function renderPositionTags() {
      const container = document.getElementById('positionTags');
      if (!allLeads.length) { container.innerHTML = ''; container.style.display = 'none'; return; }

      // 按实际 position 原值统计出现次数
      const counts = {};
      for (const lead of allLeads) {
        const pos = (lead.position || '').trim();
        if (!pos) continue;
        counts[pos] = (counts[pos] || 0) + 1;
      }

      // 按数量降序排列，取前 15 个
      const sortedPositions = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 15)
        .map(([pos, count]) => ({ pos, count }));

      if (sortedPositions.length === 0) { container.innerHTML = ''; container.style.display = 'none'; return; }

      const currentFilter = document.getElementById('positionFilter').value.trim();
      let html = `<button class="position-tag ${!currentFilter ? 'active' : ''}" onclick="filterByPosition('')">全部 <span class="count">(${allLeads.length})</span></button>`;
      for (const { pos, count } of sortedPositions) {
        const active = currentFilter.toLowerCase() === pos.toLowerCase() ? 'active' : '';
        html += `<button class="position-tag ${active}" data-title="${attrEscape(pos)}" onclick="filterByPosition(this.dataset.title)">${escapeHtml(pos)} <span class="count">(${count})</span></button>`;
      }
      container.innerHTML = html;
      container.style.display = 'flex';
    }

    function filterByPosition(title) {
      if (!title) {
        clearFilter();
        return;
      }
      document.getElementById('positionFilter').value = title;
      // 精确匹配（不区分大小写）
      filteredLeads = allLeads.filter(l => (l.position || '').trim().toLowerCase() === title.toLowerCase());
      currentPage = 1;
      document.getElementById('filterInfo').textContent = `职位筛选："${title}" · 共 ${filteredLeads.length} 条结果`;
      document.getElementById('filterInfo').style.display = 'block';
      renderPage();
      renderPositionTags();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeContactModal();
    });

    loadData();
  </script>
</body>
</html>
