<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史结果 - B2B 客户开发工具</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --success: #059669;
      --danger: #dc2626;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }

    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
    }
    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 32px;
      padding-left: 12px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-item:hover { background: var(--bg); color: var(--text); }
    .nav-item.active { background: #e0f2fe; color: var(--primary); }
    .nav-item.logout { margin-top: auto; color: var(--danger); }
    .nav-item.logout:hover { background: #fef2f2; }

    .main {
      flex: 1;
      margin-left: 220px;
      padding: 28px 32px;
      max-width: calc(100% - 220px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .topbar h1 { font-size: 24px; }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-role { background: var(--bg); color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      align-items: end;
    }
    .filter-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .filter-group input, .filter-group select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .filter-group input:focus, .filter-group select:focus { border-color: var(--primary); }
    .filter-actions {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    button.sm { padding: 6px 12px; font-size: 12px; }
    button.success { background: var(--success); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    td { color: var(--text); vertical-align: middle; }
    tr:hover td { background: #f8fafc; }
    .col-time { width: 140px; }
    .col-keyword { min-width: 220px; word-break: break-all; }
    .col-count { width: 90px; }
    .col-actions { width: 220px; white-space: nowrap; }

    .empty { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }

    .source-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .source-apollo { color: #7c3aed; background: #ede9fe; }
    .source-apollo_org { color: #5b21b6; background: #ddd6fe; }
    .source-keyword { color: #0369a1; background: #e0f2fe; }
    .source-google_maps { color: #059669; background: #d1fae5; }
    .source-domains { color: #b45309; background: #fef3c7; }
    .source-supplier_portal { color: #c2410c; background: #ffedd5; }

    @media (max-width: 768px) {
      .sidebar { width: 64px; padding: 16px 8px; }
      .sidebar h2 { display: none; }
      .nav-item span { display: none; }
      .main { margin-left: 64px; max-width: calc(100% - 64px); padding: 16px; }
      .filters { grid-template-columns: 1fr; }
      .col-actions { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-active="history"></aside>

    <main class="main">
      <div class="topbar">
        <h1>历史结果</h1>
        <div class="user-chip">
          <span id="userName">--</span>
          <span id="userRole" class="badge badge-role">--</span>
        </div>
      </div>

      <div class="card">
        <div class="filters">
          <div class="filter-group">
            <label>关键词</label>
            <input type="text" id="filterKeyword" placeholder="搜索关键词...">
          </div>
          <div class="filter-group">
            <label>开始日期</label>
            <input type="date" id="filterDateFrom">
          </div>
          <div class="filter-group">
            <label>结束日期</label>
            <input type="date" id="filterDateTo">
          </div>
          <div class="filter-group">
            <label>搜索模式</label>
            <select id="filterSource">
              <option value="">全部模式</option>
              <option value="apollo">Apollo 搜索</option>
              <option value="apollo_org">Apollo 企业搜索</option>
              <option value="keyword">关键词搜索</option>
              <option value="google_maps">Google Maps</option>
              <option value="domains">批量导入域名</option>
              <option value="supplier_portal">供应商门户</option>
            </select>
          </div>
          <div class="filter-group" id="filterUserWrap" style="display:none;">
            <label>业务员</label>
            <select id="filterUser"><option value="">全部业务员</option></select>
          </div>
          <div class="filter-actions">
            <button onclick="loadSearches()">查询</button>
            <button class="secondary" onclick="resetFilters()">重置</button>
          </div>
        </div>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th class="col-time">时间</th>
              <th class="col-keyword">关键词</th>
              <th>模式</th>
              <th class="col-user" style="display:none;">业务员</th>
              <th class="col-count">线索数</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="historyTable">
            <tr><td colspan="5" class="empty">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    let currentUser = null;

    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) { window.location.href = '/login'; return; }
        currentUser = await res.json();
        document.getElementById('userName').textContent = currentUser.name || currentUser.user_id;
        document.getElementById('userRole').textContent = currentUser.role === 'admin' ? '管理员' : '业务员';
        if (currentUser.role === 'admin') {
          document.getElementById('filterUserWrap').style.display = 'block';
          document.querySelector('.col-user').style.display = 'table-cell';
          loadUsers();
        }
      } catch (err) {
        window.location.href = '/login';
      }
    }

    async function logout() {
      try { await fetch('/logout', { method: 'POST' }); } catch (e) {}
      window.location.href = '/login';
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        if (!res.ok) return;
        const data = await res.json();
        const sel = document.getElementById('filterUser');
        sel.innerHTML = '<option value="">全部业务员</option>';
        for (const u of data.users || []) {
          const opt = document.createElement('option');
          opt.value = u.user_id;
          opt.textContent = u.name || u.user_id;
          sel.appendChild(opt);
        }
      } catch (err) {
        // ignore
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function sourceLabel(type) {
      const map = {
        'apollo': ['Apollo 搜索', 'source-apollo'],
        'apollo_org': ['Apollo 企业搜索', 'source-apollo_org'],
        'keyword': ['关键词搜索', 'source-keyword'],
        'google_maps': ['Google Maps', 'source-google_maps'],
        'domains': ['批量域名', 'source-domains'],
        'supplier_portal': ['供应商门户', 'source-supplier_portal'],
      };
      const [label, cls] = map[type] || ['其他', ''];
      return `<span class="source-badge ${cls}">${escapeHtml(label)}</span>`;
    }

    function formatTime(iso) {
      if (!iso) return '-';
      return iso.slice(0, 16).replace('T', ' ');
    }

    async function loadSearches() {
      const tbody = document.getElementById('historyTable');
      const colCount = (currentUser && currentUser.role === 'admin') ? 6 : 5;
      tbody.innerHTML = `<tr><td colspan="${colCount}" class="empty">加载中...</td></tr>`;

      const params = new URLSearchParams();
      const keyword = document.getElementById('filterKeyword').value.trim();
      const dateFrom = document.getElementById('filterDateFrom').value;
      const dateTo = document.getElementById('filterDateTo').value;
      const source = document.getElementById('filterSource').value;
      const userId = document.getElementById('filterUser').value;
      if (keyword) params.append('keyword', keyword);
      if (dateFrom) params.append('date_from', dateFrom);
      if (dateTo) params.append('date_to', dateTo);
      if (source) params.append('source_type', source);
      if (userId) params.append('user_id', userId);

      try {
        const res = await fetch('/api/searches?' + params.toString());
        if (!res.ok) {
          const text = await res.text();
          console.error('搜索历史接口错误', res.status, text);
          tbody.innerHTML = `<tr><td colspan="${colCount}" class="empty">加载失败：${escapeHtml(res.status + ' ' + (text || '')).slice(0, 200)}</td></tr>`;
          return;
        }
        const data = await res.json();
        renderSearches(data.searches || []);
      } catch (err) {
        console.error('搜索历史加载异常', err);
        tbody.innerHTML = `<tr><td colspan="${colCount}" class="empty">加载失败：${escapeHtml(err.message || '网络错误')}</td></tr>`;
      }
    }

    function renderSearches(searches) {
      const tbody = document.getElementById('historyTable');
      const isAdmin = currentUser && currentUser.role === 'admin';
      const colCount = isAdmin ? 6 : 5;
      const userColDisplay = isAdmin ? 'table-cell' : 'none';
      if (!searches.length) {
        tbody.innerHTML = `<tr><td colspan="${colCount}" class="empty">暂无搜索结果</td></tr>`;
        return;
      }
      document.querySelector('.col-user').style.display = userColDisplay;
      tbody.innerHTML = '';
      for (const s of searches) {
        const tr = document.createElement('tr');
        tr.innerHTML =
          `<td class="col-time">${escapeHtml(formatTime(s.searched_at))}</td>` +
          `<td class="col-keyword">${escapeHtml(s.keyword || '')}</td>` +
          `<td>${sourceLabel(s.source_type)}</td>` +
          `<td class="col-user" style="display:${userColDisplay};">${escapeHtml(s.user_name || s.user_id || '')}</td>` +
          `<td class="col-count">${s.total || 0}</td>` +
          `<td class="col-actions">` +
            `<button class="sm" onclick="location.href='/result?job_id=${encodeURIComponent(s.job_id)}'">查看</button> ` +
            `<button class="sm secondary" onclick="downloadCsv('${escapeHtml(s.job_id)}')">CSV</button> ` +
            `<button class="sm success" onclick="downloadExcel('${escapeHtml(s.job_id)}')">Excel</button>` +
          `</td>`;
        tbody.appendChild(tr);
      }
    }

    function downloadCsv(jobId) {
      window.open('/api/leads/download/' + encodeURIComponent(jobId), '_blank');
    }

    function downloadExcel(jobId) {
      window.open('/api/searches/' + encodeURIComponent(jobId) + '/excel', '_blank');
    }

    function resetFilters() {
      document.getElementById('filterKeyword').value = '';
      document.getElementById('filterDateFrom').value = '';
      document.getElementById('filterDateTo').value = '';
      document.getElementById('filterSource').value = '';
      document.getElementById('filterUser').value = '';
      loadSearches();
    }

    checkAuth().then(() => loadSearches());
  </script>
  <script src="/static/components/sidebar.js"></script>
</body>
</html>
