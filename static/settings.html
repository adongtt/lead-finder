<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统状态 - B2B 客户开发工具</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
    }
    .sidebar h2 { font-size: 18px; margin-bottom: 32px; padding-left: 12px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-item:hover { background: var(--bg); color: var(--text); }
    .nav-item.active { background: #e0f2fe; color: var(--primary); }
    .nav-item.logout { margin-top: auto; color: var(--danger); }
    .nav-item.logout:hover { background: #fef2f2; }

    .main {
      flex: 1;
      margin-left: 220px;
      padding: 28px 32px;
      max-width: calc(100% - 220px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .topbar h1 { font-size: 24px; }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-role { background: var(--bg); color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h3 {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 16px;
      font-weight: 600;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .status-item .name {
      font-size: 14px;
      font-weight: 500;
    }
    .status-item .source {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-ok { background: #d1fae5; color: #065f46; }
    .status-missing { background: #fee2e2; color: #991b1b; }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: var(--muted); }

    .warn-box {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      color: #92400e;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .empty { padding: 40px; text-align: center; color: var(--muted); }
    .error-box {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .sidebar { width: 64px; padding: 16px 8px; }
      .sidebar h2 { display: none; }
      .nav-item span:last-child { display: none; }
      .main { margin-left: 64px; max-width: calc(100% - 64px); padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-active="settings"></aside>

    <main class="main">
      <div class="topbar">
        <h1>系统状态</h1>
        <div class="user-chip">
          <span id="userName">--</span>
          <span id="userRole" class="badge badge-role">--</span>
        </div>
      </div>

      <div id="errorBox" class="error-box" style="display:none;"></div>
      <div id="warnBox" class="warn-box" style="display:none;"></div>

      <div class="card">
        <h3>API 密钥配置</h3>
        <div id="keysBox" class="status-grid">
          <div class="empty">加载中...</div>
        </div>
      </div>

      <div class="card" id="apolloCreditsCard" style="display:none;">
        <h3>Apollo.io 额度</h3>
        <div id="apolloCreditsBox"></div>
      </div>

      <div class="card">
        <h3>运行环境</h3>
        <div id="envBox">
          <div class="empty">加载中...</div>
        </div>
      </div>

      <div class="card">
        <h3>说明</h3>
        <p style="font-size:13px;color:var(--muted);line-height:1.7;">
          本页仅显示密钥是否已配置，不会展示密钥内容。如需修改，请编辑服务器上的 <code>config.yaml</code> 或对应环境变量，然后重启服务。
        </p>
      </div>
    </main>
  </div>

  <script src="/static/components/sidebar.js"></script>
  <script>
    const KEY_LABELS = {
      serpapi: 'SerpAPI',
      google_maps: 'Google Maps',
      hunter: 'Hunter.io',
      snov: 'Snov.io',
      apollo: 'Apollo.io',
      norbert: 'VoilaNorbert',
      zerobounce: 'ZeroBounce',
    };

    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) { window.location.href = '/login'; return; }
        const user = await res.json();
        document.getElementById('userName').textContent = user.name || user.user_id;
        document.getElementById('userRole').textContent = user.role === 'admin' ? '管理员' : '业务员';
      } catch (err) {
        window.location.href = '/login';
      }
    }

    async function logout() {
      try { await fetch('/logout', { method: 'POST' }); } catch (e) {}
      window.location.href = '/login';
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    async function loadStatus() {
      try {
        const res = await fetch('/api/config/status');
        if (!res.ok) throw new Error((await res.text()).slice(0, 100));
        const data = await res.json();

        const keysBox = document.getElementById('keysBox');
        const items = Object.entries(data.keys || {}).map(([k, v]) => {
          const label = KEY_LABELS[k] || k;
          const ok = v.configured;
          return `
            <div class="status-item">
              <div>
                <div class="name">${label}</div>
                <div class="source">来源：${v.source === 'config.yaml' ? '配置文件' : '环境变量'}</div>
              </div>
              <span class="status-badge ${ok ? 'status-ok' : 'status-missing'}">${ok ? '已配置' : '未配置'}</span>
            </div>
          `;
        }).join('');
        keysBox.innerHTML = items || '<div class="empty">暂无数据</div>';

        const envBox = document.getElementById('envBox');
        envBox.innerHTML = `
          <div class="info-row">
            <span class="label">配置来源</span>
            <span>${data.config_source === 'config.yaml' ? 'config.yaml' : '环境变量'}</span>
          </div>
          <div class="info-row">
            <span class="label">数据库连接</span>
            <span class="status-badge ${data.database_connected ? 'status-ok' : 'status-missing'}">${data.database_connected ? '正常' : '异常'}</span>
          </div>
        `;

        if (data.apollo_credits && data.apollo_credits.configured) {
          const card = document.getElementById('apolloCreditsCard');
          const box = document.getElementById('apolloCreditsBox');
          const c = data.apollo_credits;
          let html = '';
          if (c.reachable === false) {
            html = `
              <div class="status-item">
                <div>
                  <div class="name">额度查询失败</div>
                  <div class="source">${c.error || '未知错误'}</div>
                </div>
                <span class="status-badge status-missing">异常</span>
              </div>
            `;
          } else if (c.usage) {
            const u = c.usage;
            const dayUsed = Number.isFinite(Number(u.daily.used)) ? Number(u.daily.used) : 0;
            const dayLimit = Number.isFinite(Number(u.daily.limit)) ? Number(u.daily.limit) : 0;
            const dayRemaining = Number.isFinite(Number(u.daily.remaining)) ? Number(u.daily.remaining) : (dayLimit - dayUsed);
            const pct = dayLimit > 0 ? Math.round((dayUsed / dayLimit) * 100) : 0;
            html = `
              <div class="info-row">
                <span class="label">本分钟</span>
                <span>${u.minute.used ?? '-'}/${u.minute.limit ?? '-'}（剩余 ${u.minute.remaining ?? '-'})</span>
              </div>
              <div class="info-row">
                <span class="label">本小时</span>
                <span>${u.hourly.used ?? '-'}/${u.hourly.limit ?? '-'}（剩余 ${u.hourly.remaining ?? '-'})</span>
              </div>
              <div class="info-row">
                <span class="label">近 24 小时</span>
                <span>${dayUsed}/${dayLimit}（剩余 ${dayRemaining >= 0 ? dayRemaining : '-'})</span>
              </div>
              <div style="margin-top:12px;">
                <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;">
                  <span>24 小时已用 ${pct}%</span>
                  <span>${dayRemaining >= 0 ? '剩余 ' + dayRemaining : ''}</span>
                </div>
                <div style="height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;">
                  <div style="width:${pct}%;height:100%;background:${pct > 90 ? '#dc2626' : pct > 70 ? '#d97706' : '#059669'};"></div>
                </div>
              </div>
              <p style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5;">
                注：此处为 Apollo API 请求次数额度。联系人的 “邮箱 reveal” credits 请在
                <a href="https://app.apollo.io/#/settings/billing" target="_blank" style="color:var(--primary);">Apollo 后台 Billing</a>
                查看。
              </p>
            `;
          }
          box.innerHTML = html;
          card.style.display = 'block';
        }

        if (data.session_secret_default) {
          const warn = document.getElementById('warnBox');
          warn.textContent = '⚠️ 当前使用默认 SESSION_SECRET，生产环境请务必设置环境变量 SESSION_SECRET 以保证安全。';
          warn.style.display = 'block';
        }
      } catch (err) {
        showError('加载系统状态失败：' + err.message);
      }
    }

    checkAuth().then(() => loadStatus());
  </script>
</body>
</html>
