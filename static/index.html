<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B 客户开发工具</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --success: #059669;
      --danger: #dc2626;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 20px;
    }
    .container { width: 100%; max-width: 1200px; }
    .main-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: flex-start; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: var(--muted); margin-bottom: 32px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .sig-compact {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .sig-compact .sig-input { margin-bottom: 0; }
    .sig-compact button { grid-column: 1 / -1; padding: 10px; font-size: 13px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result { margin-top: 20px; max-height: 420px; overflow-y: auto; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-success { background: rgba(52,211,153,0.15); color: var(--success); }
    .badge-error { background: rgba(248,113,113,0.15); color: var(--danger); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    td { color: var(--text); }
    .download-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 18px;
      background: var(--success);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    .error-box {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px;
      padding: 14px;
      margin-top: 16px;
      font-size: 13px;
      color: var(--danger);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .log-box {
      margin-top: 16px;
      max-height: 320px;
      overflow-y: auto;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #475569;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-box:empty { display: none; }
    .progress-wrap {
      margin-top: 12px;
      display: none;
    }
    .progress-wrap.active { display: block; }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 999px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 12px;
      color: #64748b;
    }
    .main-layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: flex-start; }
    .right-panel h2 { font-size: 15px; margin-bottom: 12px; font-weight: 700; }
    .keyword-list { list-style: none; max-height: 220px; overflow-y: auto; padding-right: 4px; }
    .keyword-list::-webkit-scrollbar { width: 4px; }
    .keyword-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .keyword-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .keyword-list li:hover { border-color: var(--primary); }
    .keyword-list .term { font-size: 14px; color: var(--text); word-break: break-all; }
    .keyword-list .count { font-size: 12px; color: var(--muted); background: var(--card); padding: 2px 8px; border-radius: 999px; margin-left: 8px; flex-shrink: 0; }
    .empty-hint { font-size: 13px; color: var(--muted); }
    .email-btn {
      padding: 4px 10px;
      font-size: 12px;
      width: auto;
      border-radius: 6px;
      background: var(--success);
      color: #fff;
    }
    .email-panel {
      margin-top: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .email-panel h3 { font-size: 16px; margin-bottom: 12px; }
    .email-panel select, .email-panel textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .email-panel textarea {
      background: #f1f5f9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      line-height: 1.6;
      resize: vertical;
    }
    .email-panel .row-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .email-panel .row-actions button { width: auto; flex: 1; padding: 10px; font-size: 14px; }
    .sig-input {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 8px;
      outline: none;
    }
    .sig-input:focus { border-color: var(--primary); }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
    }
    .modal h3 { font-size: 18px; margin-bottom: 16px; }
    .timeline { margin: 16px 0; }
    .timeline-item {
      border-left: 2px solid var(--border);
      padding-left: 16px;
      padding-bottom: 16px;
      position: relative;
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -5px;
      top: 4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }
    .timeline-time { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .timeline-action { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .timeline-notes { font-size: 13px; color: var(--muted); }
    .status-new { background: rgba(5,150,105,0.12); color: #047857; }
    .status-sent { background: rgba(220,38,38,0.10); color: #b91c1c; }
    .status-replied { background: rgba(217,119,6,0.12); color: #b45309; }
    .status-quoted { background: rgba(37,99,235,0.10); color: #1d4ed8; }
    .status-negotiating { background: rgba(124,58,237,0.10); color: #6d28d9; }
    .status-won { background: rgba(5,150,105,0.15); color: #047857; }
    .status-lost { background: rgba(100,116,139,0.12); color: #475569; }
    @media (max-width: 768px) {
      .main-layout { grid-template-columns: 1fr; }
      .right-panel { order: -1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <div class="left-panel">
        <h1>B2B 客户开发工具</h1>
        <p class="subtitle">输入关键词搜索，提取域名，发现决策人邮箱。</p>

        <div class="card">
          <form id="searchForm">
            <!-- 搜索模式切换 -->
            <div style="margin-bottom:16px">
              <label>搜索模式</label>
              <div style="display:flex;gap:8px;">
                <button type="button" id="modeKeyword" class="mode-btn active" onclick="setMode('keyword')" style="flex:1;padding:8px 12px;font-size:13px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;">关键词搜索</button>
                <button type="button" id="modeDomains" class="mode-btn" onclick="setMode('domains')" style="flex:1;padding:8px 12px;font-size:13px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer;">批量导入域名</button>
              </div>
            </div>

            <div style="margin-bottom:16px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <label for="keyword">关键词</label>
                <select id="keywordTemplate" onchange="applyTemplate()" style="width:auto;padding:4px 8px;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;">
                  <option value="">选择模板...</option>
                  <option value="baseball gloves distributor">棒球手套分销商</option>
                  <option value="football equipment importer">橄榄球装备进口商</option>
                  <option value="sporting goods wholesaler USA">体育用品批发商美国</option>
                  <option value="work gloves manufacturer Europe">劳保手套制造商欧洲</option>
                  <option value="cycling gloves brand">骑行手套品牌商</option>
                  <option value="softball gloves retailer">垒球手套零售商</option>
                  <option value="gym gloves supplier">健身手套供应商</option>
                  <option value="ski gloves distributor">滑雪手套分销商</option>
                </select>
              </div>
              <input type="text" id="keyword" name="keyword" placeholder='例如 "baseball gloves distributor"' required>
            </div>

            <!-- 批量导入域名（默认隐藏） -->
            <div id="domainsWrap" style="margin-bottom:16px;display:none;">
              <label for="domainsInput">域名列表（每行一个或逗号分隔）</label>
              <textarea id="domainsInput" rows="5" placeholder="example.com\nabc-inc.com\nsportsgear.de" style="width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:14px;resize:vertical;"></textarea>
              <p class="hint">从展会名单、海关数据等渠道获取的域名，直接粘贴进来</p>
            </div>

            <div class="row">
              <div>
                <label for="pages">搜索页数</label>
                <input type="number" id="pages" name="pages" value="20" min="1">
                <p class="hint">要扫描多少页搜索结果</p>
              </div>
              <div>
                <label for="max_domains">最大域名数</label>
                <input type="number" id="max_domains" name="max_domains" min="1" placeholder="无限制">
                <p class="hint">留空表示无限制</p>
              </div>
            </div>

            <div style="margin-bottom:20px">
              <label for="exclude">排除域名（可选）</label>
              <input type="text" id="exclude" name="exclude" placeholder="nike.com,adidas.com">
              <p class="hint">逗号分隔，跳过这些域名</p>
            </div>

            <!-- 目标国家过滤 -->
            <div style="margin-bottom:20px">
              <label>目标国家 / 地区（可选）</label>
              <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
                <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);">
                  <input type="checkbox" name="target_tld" value=".com" checked style="width:auto;"> 美国 (.com)
                </label>
                <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);">
                  <input type="checkbox" name="target_tld" value=".de" style="width:auto;"> 德国 (.de)
                </label>
                <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);">
                  <input type="checkbox" name="target_tld" value=".uk" style="width:auto;"> 英国 (.uk)
                </label>
                <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);">
                  <input type="checkbox" name="target_tld" value=".fr" style="width:auto;"> 法国 (.fr)
                </label>
                <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);">
                  <input type="checkbox" name="target_tld" value=".au" style="width:auto;"> 澳大利亚 (.au)
                </label>
                <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);">
                  <input type="checkbox" name="target_tld" value=".ca" style="width:auto;"> 加拿大 (.ca)
                </label>
                <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);">
                  <input type="checkbox" name="target_tld" value=".nl" style="width:auto;"> 荷兰 (.nl)
                </label>
                <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);">
                  <input type="checkbox" name="target_tld" value=".jp" style="width:auto;"> 日本 (.jp)
                </label>
              </div>
              <p class="hint">不选则保留所有国家；.com 全球通用，默认勾选</p>
            </div>

            <div style="margin-bottom:20px">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text);">
                <input type="checkbox" id="deep" name="deep" style="width:auto;">
                深度搜索 — 跳过前 5 页，避开大品牌
              </label>
              <p class="hint">搜索小型分销商 / 零售商时建议开启</p>
            </div>

            <div style="margin-bottom:20px">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text);">
                <input type="checkbox" id="amazon" name="amazon" style="width:auto;">
                同时搜索 Amazon 品牌 — 抓取亚马逊上的产品品牌并找官网
              </label>
              <p class="hint">从 Amazon 热门产品中发现潜在品牌客户（需要翻墙）</p>
            </div>

            <button type="submit" id="submitBtn">
              <span id="btnText">查找客户</span>
            </button>
          </form>

          <div id="logBox" class="log-box"></div>
          <div id="progressWrap" class="progress-wrap">
            <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            <div class="progress-info"><span id="progressStep">准备中...</span><span id="progressPct">0%</span></div>
          </div>
          <div id="result" class="result"></div>
          <div id="emailPanel" class="email-panel" style="display:none;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <h3>写开发信</h3>
              <button onclick="closeEmailPanel()" style="width:auto;padding:6px 12px;font-size:12px;background:var(--border);color:var(--text);">关闭</button>
            </div>
            <div style="margin-bottom:12px;">
              <label style="margin-bottom:6px;">模板</label>
              <select id="emailTemplate" onchange="generateEmail()">
                <option value="a">品牌 / 分销商（欧美）</option>
                <option value="b">采购经理</option>
                <option value="c">跟进邮件</option>
              </select>
            </div>
            <div style="margin-bottom:12px;">
              <label style="margin-bottom:6px;">主题</label>
              <input type="text" id="emailSubject" class="sig-input" style="margin-bottom:0;">
            </div>
            <div style="margin-bottom:12px;">
              <label style="margin-bottom:6px;">正文</label>
              <textarea id="emailBody" rows="12"></textarea>
            </div>
            <div class="row-actions">
              <button onclick="copyEmail()">复制邮件</button>
            </div>
          </div>
        </div>
      </div>

      <aside class="right-panel">
        <div class="card" id="userCard" style="display:none;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h2 id="userName" style="font-size:16px;margin-bottom:4px;">--</h2>
              <span id="userRole" class="badge" style="font-size:11px;background:var(--border);color:var(--muted);">--</span>
            </div>
            <button onclick="logout()" style="width:auto;padding:8px 14px;font-size:13px;background:var(--border);color:var(--text);">退出</button>
          </div>
        </div>
        <div class="card">
          <h2>热门搜索</h2>
          <ul id="keywordList" class="keyword-list">
            <li class="empty-hint">加载中...</li>
          </ul>
        </div>
        <div class="card">
          <h2>邮件签名</h2>
          <div class="sig-compact">
            <input type="text" id="sigName" class="sig-input" placeholder="您的姓名">
            <input type="text" id="sigCompany" class="sig-input" placeholder="公司名称">
            <input type="text" id="sigPhone" class="sig-input" placeholder="电话 / WhatsApp">
            <button onclick="saveSignature()">保存签名</button>
          </div>
        </div>
        <div class="card">
          <h2>已联系客户</h2>
          <ul id="contactedList" class="keyword-list">
            <li class="empty-hint">加载中...</li>
          </ul>
        </div>
        <div class="card">
          <h2>历史搜索</h2>
          <ul id="searchList" class="keyword-list">
            <li class="empty-hint">加载中...</li>
          </ul>
        </div>
      </aside>
    </div>
  </div>

  <div id="contactModal" class="modal-overlay" onclick="if(event.target===this)closeContactModal()">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 id="modalTitle">客户详情</h3>
        <button onclick="closeContactModal()" style="width:auto;padding:6px 12px;font-size:12px;background:var(--border);color:var(--text);">关闭</button>
      </div>
      <div id="modalBody"></div>
      <hr style="border:0;border-top:1px solid var(--border);margin:20px 0;">
      <h4 style="font-size:14px;margin-bottom:12px;">添加跟进</h4>
      <div style="margin-bottom:12px;">
        <label style="margin-bottom:6px;">状态</label>
        <select id="followupAction" class="sig-input" style="margin-bottom:0;">
          <option value="已发邮件">已发邮件</option>
          <option value="已回复">已回复</option>
          <option value="已报价">已报价</option>
          <option value="谈判中">谈判中</option>
          <option value="成交">成交</option>
          <option value="放弃">放弃</option>
        </select>
      </div>
      <div style="margin-bottom:12px;">
        <label style="margin-bottom:6px;">备注</label>
        <textarea id="followupNotes" rows="3" class="sig-input" style="resize:vertical;"></textarea>
      </div>
      <div style="margin-bottom:12px;">
        <label style="margin-bottom:6px;">下次跟进时间</label>
        <input type="date" id="followupDate" class="sig-input" style="margin-bottom:0;">
      </div>
      <button onclick="submitFollowup()">保存跟进</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const resultDiv = document.getElementById('result');
    const logBox = document.getElementById('logBox');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressPct = document.getElementById('progressPct');
    const progressStep = document.getElementById('progressStep');
    let currentMode = 'keyword';

    function setMode(mode) {
      currentMode = mode;
      const btnKeyword = document.getElementById('modeKeyword');
      const btnDomains = document.getElementById('modeDomains');
      const domainsWrap = document.getElementById('domainsWrap');
      const keywordInput = document.getElementById('keyword');
      if (mode === 'keyword') {
        btnKeyword.style.background = 'var(--primary)';
        btnKeyword.style.color = '#fff';
        btnKeyword.style.border = 'none';
        btnDomains.style.background = 'var(--bg)';
        btnDomains.style.color = 'var(--text)';
        btnDomains.style.border = '1px solid var(--border)';
        domainsWrap.style.display = 'none';
        keywordInput.required = true;
      } else {
        btnDomains.style.background = 'var(--primary)';
        btnDomains.style.color = '#fff';
        btnDomains.style.border = 'none';
        btnKeyword.style.background = 'var(--bg)';
        btnKeyword.style.color = 'var(--text)';
        btnKeyword.style.border = '1px solid var(--border)';
        domainsWrap.style.display = 'block';
        keywordInput.required = false;
      }
    }

    function applyTemplate() {
      const tpl = document.getElementById('keywordTemplate').value;
      if (tpl) {
        document.getElementById('keyword').value = tpl;
      }
    }

    function linkedinCompanyUrl(company) {
      return 'https://www.linkedin.com/search/results/companies/?keywords=' + encodeURIComponent(company || '');
    }

    function setProgress(pct) {
      progressFill.style.width = pct + '%';
      progressPct.textContent = pct + '%';
      if (pct < 20) progressStep.textContent = '搜索引擎查询中...';
      else if (pct < 30) progressStep.textContent = '域名评分与提取...';
      else if (pct < 50) progressStep.textContent = '抓取网站元数据...';
      else if (pct < 80) progressStep.textContent = '发现邮箱中...';
      else if (pct < 90) progressStep.textContent = '补全 LinkedIn 信息...';
      else if (pct < 100) progressStep.textContent = '验证与导出...';
      else progressStep.textContent = '完成';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      resultDiv.innerHTML = '';
      logBox.textContent = '';
      progressWrap.classList.add('active');
      setProgress(0);
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> 搜索中...';

      const keyword = document.getElementById('keyword').value || 'direct-import';
      const pages = document.getElementById('pages').value;
      const maxDomains = document.getElementById('max_domains').value;
      const exclude = document.getElementById('exclude').value;
      const deep = document.getElementById('deep').checked;
      const amazon = document.getElementById('amazon').checked;
      const domainsInput = document.getElementById('domainsInput').value;
      const checkedTlds = Array.from(document.querySelectorAll('input[name="target_tld"]:checked')).map(cb => cb.value);

      const params = new URLSearchParams({ keyword, pages });
      if (maxDomains) params.append('max_domains', maxDomains);
      if (exclude) params.append('exclude', exclude);
      if (deep) params.append('deep', 'true');
      if (amazon) params.append('amazon', 'true');
      if (domainsInput) params.append('domains', domainsInput);
      if (checkedTlds.length > 0) params.append('target_tlds', checkedTlds.join(','));

      const es = new EventSource(`/api/leads/stream?${params.toString()}`);

      es.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'log') {
          const text = data.content;
          const m = text.match(/^PROGRESS:\s*(\d+)$/);
          if (m) {
            setProgress(parseInt(m[1], 10));
          } else {
            logBox.textContent += text + '\n';
            logBox.scrollTop = logBox.scrollHeight;
          }
        } else if (data.type === 'done') {
          es.close();
          progressWrap.classList.remove('active');
          btn.disabled = false;
          btnText.textContent = '查找客户';
          if (data.status === 'success') {
            renderResult(data);
            loadKeywords();
          } else {
            resultDiv.innerHTML = `<div class="badge badge-error">搜索失败</div><div class="error-box">${escapeHtml(data.message || '未知错误')}</div>`;
          }
        }
      };

      es.onerror = () => {
        es.close();
        progressWrap.classList.remove('active');
        btn.disabled = false;
        btnText.textContent = '查找客户';
        resultDiv.innerHTML = '<div class="badge badge-error">连接错误</div><div class="error-box">连接失败，请重试。</div>';
      };
    });

    function renderResult(data) {
      if (data.download_url) window.currentDownloadUrl = data.download_url;
      if (data.job_id) window.currentJobId = data.job_id;
      let html = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <span class="badge badge-success">找到 ${data.total} 个客户</span>
        ${data.job_id ? `<a href="/result?job_id=${encodeURIComponent(data.job_id)}" class="download-btn">查看全部</a>` : ''}
      </div>`;
      if (data.preview && data.preview.length > 0) {
        html += '<table><thead><tr>' +
          '<th>邮箱</th><th>姓名</th><th>职位</th><th>国家</th><th>公司</th><th>域名</th><th>状态</th><th>操作</th>' +
          '</tr></thead><tbody>';
        for (let i = 0; i < data.preview.length; i++) {
          const row = data.preview[i];
          const contacted = row.contacted;
          const badge = statusBadge(row.status || (contacted ? '已发邮件' : '未联系'));
          const liUrl = linkedinCompanyUrl(row.company || row.domain || '');
          html += `<tr data-idx="${i}">` +
            `<td>${escapeHtml(row.email || '')}</td>` +
            `<td>${escapeHtml((row.first_name || '') + ' ' + (row.last_name || ''))}</td>` +
            `<td>${escapeHtml(row.position || '')}</td>` +
            `<td>${escapeHtml(row.country || '')}</td>` +
            `<td>${escapeHtml(row.company || '')} <a href="${liUrl}" target="_blank" rel="noopener" title="LinkedIn 搜索公司" style="color:#0a66c2;font-size:11px;margin-left:4px;">[in]</a></td>` +
            `<td>${escapeHtml(row.domain || '')}</td>` +
            `<td>${badge}</td>` +
            `<td>` +
              `<button class="email-btn" onclick="openEmailPanel(${i})">发邮件</button>` +
              (contacted
                ? ` <button class="email-btn" style="background:var(--primary);color:#fff;" onclick="openContactDetail('${escapeHtml(row.email)}')">跟进</button>`
                : ` <button class="email-btn" style="background:var(--border);color:var(--text);" onclick="markContacted(${i})">标记已联系</button>`) +
            `</td>` +
            '</tr>';
        }
        html += '</tbody></table>';
      }
      resultDiv.innerHTML = html;
      window.currentLeads = data.preview || [];
    }

    const TEMPLATES = {
      a: {
        subject: "Quick question about {{company}}'s glove supplier",
        body: `Hi {{first_name}},\n\nI came across {{company}} while researching baseball glove brands in the US market. We're a manufacturer specializing in custom baseball and football gloves with OEM/ODM capabilities, mainly exporting to Europe, North America and Southeast Asia.\n\nI noticed {{company}} has been expanding its product line — are you currently looking for additional manufacturing capacity or private-label options?\n\nIf this isn't your area, could you point me to the right person?\n\nBest,\n{{signature}}`
      },
      b: {
        subject: "{{company}} glove manufacturing — worth a 2-min chat?",
        body: `Hi {{first_name}},\n\nI'm reaching out because we produce MLB-grade baseball gloves and American football gloves for brands in Germany and the UK, and I think there could be a fit with {{company}}.\n\nOur MOQ starts at 500 pcs with 4-week turnaround. We also offer full custom design and padding spec adjustments.\n\nWorth a brief conversation to see if there's synergy?\n\nBest,\n{{signature}}`
      },
      c: {
        subject: "Re: {{company}} supplier question",
        body: `Hi {{first_name}},\n\nJust bumping this up in case it got buried. No pressure if timing isn't right.\n\nTo add context — one of our US clients increased their margin by 30% after switching to our direct manufacturing model. Happy to share the case study if helpful.\n\nBest,\n{{signature}}`
      }
    };

    let currentEmailIdx = null;

    function openEmailPanel(idx) {
      currentEmailIdx = idx;
      generateEmail();
      document.getElementById('emailPanel').style.display = 'block';
      document.getElementById('emailPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closeEmailPanel() {
      document.getElementById('emailPanel').style.display = 'none';
      currentEmailIdx = null;
    }

    function loadSignature() {
      return {
        name: localStorage.getItem('sigName') || '',
        company: localStorage.getItem('sigCompany') || '',
        phone: localStorage.getItem('sigPhone') || ''
      };
    }

    function saveSignature() {
      localStorage.setItem('sigName', document.getElementById('sigName').value);
      localStorage.setItem('sigCompany', document.getElementById('sigCompany').value);
      localStorage.setItem('sigPhone', document.getElementById('sigPhone').value);
      alert('签名已保存');
    }

    function restoreSignatureInputs() {
      const s = loadSignature();
      document.getElementById('sigName').value = s.name;
      document.getElementById('sigCompany').value = s.company;
      document.getElementById('sigPhone').value = s.phone;
    }

    function generateEmail() {
      if (currentEmailIdx === null) return;
      const lead = window.currentLeads[currentEmailIdx];
      const templateKey = document.getElementById('emailTemplate').value;
      const template = TEMPLATES[templateKey];
      const sig = loadSignature();
      const signature = sig.name
        ? `${sig.name}\n${sig.company}${sig.phone ? '\n' + sig.phone : ''}`
        : '[您的姓名]\n[公司名称]';

      const company = (lead.company || lead.domain || 'your company');
      const firstName = (lead.first_name || 'there');

      document.getElementById('emailSubject').value = template.subject
        .replace(/{{company}}/g, company)
        .replace(/{{first_name}}/g, firstName);

      document.getElementById('emailBody').value = template.body
        .replace(/{{company}}/g, company)
        .replace(/{{first_name}}/g, firstName)
        .replace(/{{signature}}/g, signature);
    }

    function copyEmail() {
      const subject = document.getElementById('emailSubject').value;
      const body = document.getElementById('emailBody').value;
      const text = `Subject: ${subject}\n\n${body}`;
      navigator.clipboard.writeText(text).then(() => alert('邮件已复制到剪贴板'));
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function statusBadge(status) {
      const map = {
        '未联系': 'status-new',
        '已发邮件': 'status-sent',
        '已回复': 'status-replied',
        '已报价': 'status-quoted',
        '谈判中': 'status-negotiating',
        '成交': 'status-won',
        '放弃': 'status-lost',
      };
      const cls = map[status] || 'status-new';
      return `<span class="badge ${cls}">${escapeHtml(status || '未联系')}</span>`;
    }

    async function loadKeywords() {
      const list = document.getElementById('keywordList');
      try {
        const res = await fetch('/api/keywords');
        const data = await res.json();
        if (!data.keywords || data.keywords.length === 0) {
          list.innerHTML = '<li class="empty-hint">暂无搜索记录</li>';
          return;
        }
        list.innerHTML = '';
        for (const item of data.keywords) {
          const li = document.createElement('li');
          li.innerHTML = `<span class="term">${escapeHtml(item.term)}</span><span class="count">${item.count}</span>`;
          li.addEventListener('click', () => {
            document.getElementById('keyword').value = item.term;
            document.getElementById('keyword').focus();
          });
          list.appendChild(li);
        }
      } catch (err) {
        list.innerHTML = '<li class="empty-hint">加载失败</li>';
      }
    }

    async function markContacted(idx) {
      const lead = window.currentLeads[idx];
      if (!lead) return;
      try {
        const form = new FormData();
        form.append('email', lead.email);
        form.append('domain', lead.domain || '');
        form.append('notes', '');
        const res = await fetch('/api/contacted', { method: 'POST', body: form });
        if (res.ok) {
          lead.contacted = true;
          lead.status = '已发邮件';
          renderResult({ total: window.currentLeads.length, preview: window.currentLeads, download_url: window.currentDownloadUrl || '' });
          loadContacted();
          openContactDetail(lead.email);
        }
      } catch (err) {
        alert('标记失败');
      }
    }

    let currentDetailEmail = null;

    async function openContactDetail(email) {
      currentDetailEmail = email;
      try {
        const res = await fetch('/api/contacted/' + encodeURIComponent(email));
        if (!res.ok) { alert('加载详情失败'); return; }
        const data = await res.json();
        renderContactModal(data);
        document.getElementById('contactModal').classList.add('active');
      } catch (err) {
        alert('加载详情失败');
      }
    }

    function closeContactModal() {
      document.getElementById('contactModal').classList.remove('active');
      currentDetailEmail = null;
    }

    function renderContactModal(data) {
      document.getElementById('modalTitle').textContent = data.email || data.contact_email || '客户详情';
      let html = `<div style="margin-bottom:12px;">当前状态：${statusBadge(data.status)}</div>`;
      if (data.next_follow_up) {
        html += `<div style="font-size:13px;color:var(--muted);margin-bottom:12px;">下次跟进：${escapeHtml(data.next_follow_up)}</div>`;
      }
      html += '<div class="timeline">';
      if (data.history && data.history.length > 0) {
        for (const h of data.history.slice().reverse()) {
          html += `<div class="timeline-item">
            <div class="timeline-time">${escapeHtml(h.at ? h.at.slice(0,16).replace('T',' ') : '')} · ${escapeHtml(h.user_name || '')}</div>
            <div class="timeline-action">${escapeHtml(h.action)}</div>
            ${h.notes ? `<div class="timeline-notes">${escapeHtml(h.notes)}</div>` : ''}
          </div>`;
        }
      } else {
        html += '<div style="color:var(--muted);font-size:13px;">暂无跟进记录</div>';
      }
      html += '</div>';
      document.getElementById('modalBody').innerHTML = html;
    }

    async function submitFollowup() {
      if (!currentDetailEmail) return;
      const action = document.getElementById('followupAction').value;
      const notes = document.getElementById('followupNotes').value;
      const next = document.getElementById('followupDate').value;
      try {
        const form = new FormData();
        form.append('action', action);
        form.append('notes', notes);
        form.append('next_follow_up', next);
        const res = await fetch('/api/contacted/' + encodeURIComponent(currentDetailEmail) + '/followup', {
          method: 'POST', body: form
        });
        if (res.ok) {
          document.getElementById('followupNotes').value = '';
          document.getElementById('followupDate').value = '';
          openContactDetail(currentDetailEmail);
          loadContacted();
          if (window.currentLeads) {
            for (const lead of window.currentLeads) {
              if (lead.email === currentDetailEmail) { lead.status = action; }
            }
            renderResult({ total: window.currentLeads.length, preview: window.currentLeads, download_url: window.currentDownloadUrl || '' });
          }
        } else {
          alert('保存失败');
        }
      } catch (err) {
        alert('保存失败');
      }
    }

    async function loadContacted() {
      const list = document.getElementById('contactedList');
      if (!list) return;
      try {
        const res = await fetch('/api/contacted');
        const data = await res.json();
        if (!data.items || data.items.length === 0) {
          list.innerHTML = '<li class="empty-hint">暂无记录</li>';
          return;
        }
        list.innerHTML = '';
        for (const item of data.items.slice(0, 20)) {
          const li = document.createElement('li');
          li.style.cursor = 'pointer';
          li.style.display = 'block';
          const status = item.status || '已发邮件';
          const time = item.created_at ? item.created_at.slice(5,16).replace('T',' ') : '';
          const who = item.user_name || '';
          li.innerHTML =
            `<div style="display:flex;justify-content:space-between;align-items:center;">` +
              `<span class="term" style="font-size:13px;">${escapeHtml(item.email || '')}</span>` +
              `${statusBadge(status)}` +
            `</div>` +
            `<div style="font-size:11px;color:var(--muted);margin-top:6px;">${escapeHtml(who)} · ${escapeHtml(time)}</div>`;
          li.addEventListener('click', () => openContactDetail(item.email));
          list.appendChild(li);
        }
      } catch (err) {
        list.innerHTML = '<li class="empty-hint">加载失败</li>';
      }
    }

    async function loadSearches() {
      const list = document.getElementById('searchList');
      if (!list) return;
      try {
        const res = await fetch('/api/searches');
        const data = await res.json();
        if (!data.searches || data.searches.length === 0) {
          list.innerHTML = '<li class="empty-hint">暂无记录</li>';
          return;
        }
        list.innerHTML = '';
        for (const s of data.searches.slice(0, 20)) {
          const li = document.createElement('li');
          li.style.cursor = 'pointer';
          const time = s.searched_at ? s.searched_at.slice(0,16).replace('T',' ') : '';
          li.innerHTML = `<span class="term">${escapeHtml(s.keyword)}</span><span class="count">${s.total || 0}</span>`;
          li.title = `${escapeHtml(s.user_name || '')} · ${time}`;
          li.addEventListener('click', () => {
            window.location.href = '/result?job_id=' + encodeURIComponent(s.job_id);
          });
          list.appendChild(li);
        }
      } catch (err) {
        list.innerHTML = '<li class="empty-hint">加载失败</li>';
      }
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) {
          window.location.href = '/login';
          return;
        }
        const user = await res.json();
        document.getElementById('userName').textContent = user.name || user.user_id;
        document.getElementById('userRole').textContent = user.role === 'admin' ? '管理员' : '业务员';
        document.getElementById('userCard').style.display = 'block';
      } catch (err) {
        window.location.href = '/login';
      }
    }

    async function logout() {
      try {
        await fetch('/logout', { method: 'POST' });
        window.location.href = '/login';
      } catch (err) {
        window.location.href = '/login';
      }
    }

    checkAuth();
    loadKeywords();
    loadContacted();
    loadSearches();
    restoreSignatureInputs();
  </script>
</body>
</html>
