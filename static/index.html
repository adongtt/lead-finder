<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B 客户开发工具</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --success: #34d399;
      --danger: #f87171;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
    }
    .container { width: 100%; max-width: 720px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: var(--muted); margin-bottom: 32px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result { margin-top: 20px; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-success { background: rgba(52,211,153,0.15); color: var(--success); }
    .badge-error { background: rgba(248,113,113,0.15); color: var(--danger); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    td { color: var(--text); }
    .download-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 18px;
      background: var(--success);
      color: #064e3b;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    .error-box {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px;
      padding: 14px;
      margin-top: 16px;
      font-size: 13px;
      color: var(--danger);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .log-box {
      margin-top: 16px;
      max-height: 320px;
      overflow-y: auto;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #94a3b8;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-box:empty { display: none; }
    .main-layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: flex-start; }
    .right-panel h2 { font-size: 16px; margin-bottom: 16px; }
    .keyword-list { list-style: none; }
    .keyword-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .keyword-list li:hover { border-color: var(--primary); }
    .keyword-list .term { font-size: 14px; color: var(--text); word-break: break-all; }
    .keyword-list .count { font-size: 12px; color: var(--muted); background: var(--card); padding: 2px 8px; border-radius: 999px; margin-left: 8px; flex-shrink: 0; }
    .empty-hint { font-size: 13px; color: var(--muted); }
    .email-btn {
      padding: 4px 10px;
      font-size: 12px;
      width: auto;
      border-radius: 6px;
      background: var(--success);
      color: #064e3b;
    }
    .email-panel {
      margin-top: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .email-panel h3 { font-size: 16px; margin-bottom: 12px; }
    .email-panel select, .email-panel textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .email-panel textarea {
      background: #0b1120;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      line-height: 1.6;
      resize: vertical;
    }
    .email-panel .row-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .email-panel .row-actions button { width: auto; flex: 1; padding: 10px; font-size: 14px; }
    .sig-input {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 8px;
      outline: none;
    }
    .sig-input:focus { border-color: var(--primary); }
    @media (max-width: 768px) {
      .main-layout { grid-template-columns: 1fr; }
      .right-panel { order: -1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <div class="left-panel">
        <h1>B2B 客户开发工具</h1>
        <p class="subtitle">输入关键词搜索，提取域名，发现决策人邮箱。</p>

        <div class="card">
          <form id="searchForm">
            <div style="margin-bottom:16px">
              <label for="keyword">关键词</label>
              <input type="text" id="keyword" name="keyword" placeholder='例如 "棒球手套 分销商"' required>
            </div>

            <div class="row">
              <div>
                <label for="pages">搜索页数</label>
                <input type="number" id="pages" name="pages" value="20" min="1">
                <p class="hint">要扫描多少页搜索结果</p>
              </div>
              <div>
                <label for="max_domains">最大域名数</label>
                <input type="number" id="max_domains" name="max_domains" min="1" placeholder="无限制">
                <p class="hint">留空表示无限制</p>
              </div>
            </div>

            <div style="margin-bottom:20px">
              <label for="exclude">排除域名（可选）</label>
              <input type="text" id="exclude" name="exclude" placeholder="nike.com,adidas.com">
              <p class="hint">逗号分隔，跳过这些域名</p>
            </div>

            <div style="margin-bottom:20px">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text);">
                <input type="checkbox" id="deep" name="deep" style="width:auto;">
                深度搜索 — 跳过前 5 页，避开大品牌
              </label>
              <p class="hint">搜索小型分销商 / 零售商时建议开启</p>
            </div>

            <button type="submit" id="submitBtn">
              <span id="btnText">查找客户</span>
            </button>
          </form>

          <div id="logBox" class="log-box"></div>
          <div id="result" class="result"></div>
          <div id="emailPanel" class="email-panel" style="display:none;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <h3>写开发信</h3>
              <button onclick="closeEmailPanel()" style="width:auto;padding:6px 12px;font-size:12px;background:var(--border);color:var(--text);">关闭</button>
            </div>
            <div style="margin-bottom:12px;">
              <label style="margin-bottom:6px;">模板</label>
              <select id="emailTemplate" onchange="generateEmail()">
                <option value="a">品牌 / 分销商（欧美）</option>
                <option value="b">采购经理</option>
                <option value="c">跟进邮件</option>
              </select>
            </div>
            <div style="margin-bottom:12px;">
              <label style="margin-bottom:6px;">主题</label>
              <input type="text" id="emailSubject" class="sig-input" style="margin-bottom:0;">
            </div>
            <div style="margin-bottom:12px;">
              <label style="margin-bottom:6px;">正文</label>
              <textarea id="emailBody" rows="12"></textarea>
            </div>
            <div class="row-actions">
              <button onclick="copyEmail()">复制邮件</button>
            </div>
          </div>
        </div>
      </div>

      <aside class="right-panel">
        <div class="card" id="userCard" style="display:none;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h2 id="userName" style="font-size:16px;margin-bottom:4px;">--</h2>
              <span id="userRole" class="badge" style="font-size:11px;background:var(--border);color:var(--muted);">--</span>
            </div>
            <button onclick="logout()" style="width:auto;padding:8px 14px;font-size:13px;background:var(--border);color:var(--text);">退出</button>
          </div>
        </div>
        <div class="card">
          <h2>热门搜索</h2>
          <ul id="keywordList" class="keyword-list">
            <li class="empty-hint">加载中...</li>
          </ul>
        </div>
        <div class="card">
          <h2>邮件签名</h2>
          <input type="text" id="sigName" class="sig-input" placeholder="您的姓名">
          <input type="text" id="sigCompany" class="sig-input" placeholder="公司名称">
          <input type="text" id="sigPhone" class="sig-input" placeholder="电话 / WhatsApp">
          <button onclick="saveSignature()" style="padding:10px;font-size:13px;">保存签名</button>
        </div>
        <div class="card">
          <h2>已联系客户</h2>
          <ul id="contactedList" class="keyword-list">
            <li class="empty-hint">加载中...</li>
          </ul>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const resultDiv = document.getElementById('result');
    const logBox = document.getElementById('logBox');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      resultDiv.innerHTML = '';
      logBox.textContent = '';
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> 搜索中...';

      const keyword = document.getElementById('keyword').value;
      const pages = document.getElementById('pages').value;
      const maxDomains = document.getElementById('max_domains').value;
      const exclude = document.getElementById('exclude').value;
      const deep = document.getElementById('deep').checked;

      const params = new URLSearchParams({ keyword, pages });
      if (maxDomains) params.append('max_domains', maxDomains);
      if (exclude) params.append('exclude', exclude);
      if (deep) params.append('deep', 'true');

      const es = new EventSource(`/api/leads/stream?${params.toString()}`);

      es.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'log') {
          logBox.textContent += data.content + '\n';
          logBox.scrollTop = logBox.scrollHeight;
        } else if (data.type === 'done') {
          es.close();
          btn.disabled = false;
          btnText.textContent = '查找客户';
          if (data.status === 'success') {
            renderResult(data);
            loadKeywords();
          } else {
            resultDiv.innerHTML = `<div class="badge badge-error">搜索失败</div><div class="error-box">${escapeHtml(data.message || '未知错误')}</div>`;
          }
        }
      };

      es.onerror = () => {
        es.close();
        btn.disabled = false;
        btnText.textContent = '查找客户';
        resultDiv.innerHTML = '<div class="badge badge-error">连接错误</div><div class="error-box">连接失败，请重试。</div>';
      };
    });

    function renderResult(data) {
      if (data.download_url) window.currentDownloadUrl = data.download_url;
      let html = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <span class="badge badge-success">找到 ${data.total} 个客户</span>
        ${window.currentDownloadUrl ? `<a href="${window.currentDownloadUrl}" class="download-btn">下载 CSV</a>` : ''}
      </div>`;
      if (data.preview && data.preview.length > 0) {
        html += '<table><thead><tr>' +
          '<th>邮箱</th><th>姓名</th><th>职位</th><th>国家</th><th>域名</th><th>状态</th><th>操作</th>' +
          '</tr></thead><tbody>';
        for (let i = 0; i < data.preview.length; i++) {
          const row = data.preview[i];
          const contacted = row.contacted;
          const statusBadge = contacted
            ? `<span class="badge" style="background:rgba(248,113,113,0.15);color:var(--danger);">已联系${row.contacted_by ? ' · ' + escapeHtml(row.contacted_by) : ''}</span>`
            : `<span class="badge" style="background:rgba(52,211,153,0.15);color:var(--success);">未联系</span>`;
          html += `<tr data-idx="${i}">` +
            `<td>${escapeHtml(row.email || '')}</td>` +
            `<td>${escapeHtml((row.first_name || '') + ' ' + (row.last_name || ''))}</td>` +
            `<td>${escapeHtml(row.position || '')}</td>` +
            `<td>${escapeHtml(row.country || '')}</td>` +
            `<td>${escapeHtml(row.domain || '')}</td>` +
            `<td>${statusBadge}</td>` +
            `<td>` +
              `<button class="email-btn" onclick="openEmailPanel(${i})">发邮件</button>` +
              (contacted ? '' : ` <button class="email-btn" style="background:var(--border);color:var(--text);" onclick="markContacted(${i})">标记已联系</button>`) +
            `</td>` +
            '</tr>';
        }
        html += '</tbody></table>';
      }
      resultDiv.innerHTML = html;
      window.currentLeads = data.preview || [];
    }

    const TEMPLATES = {
      a: {
        subject: "Quick question about {{company}}'s glove supplier",
        body: `Hi {{first_name}},\n\nI came across {{company}} while researching baseball glove brands in the US market. We're a manufacturer specializing in custom baseball and football gloves with OEM/ODM capabilities, mainly exporting to Europe, North America and Southeast Asia.\n\nI noticed {{company}} has been expanding its product line — are you currently looking for additional manufacturing capacity or private-label options?\n\nIf this isn't your area, could you point me to the right person?\n\nBest,\n{{signature}}`
      },
      b: {
        subject: "{{company}} glove manufacturing — worth a 2-min chat?",
        body: `Hi {{first_name}},\n\nI'm reaching out because we produce MLB-grade baseball gloves and American football gloves for brands in Germany and the UK, and I think there could be a fit with {{company}}.\n\nOur MOQ starts at 500 pcs with 4-week turnaround. We also offer full custom design and padding spec adjustments.\n\nWorth a brief conversation to see if there's synergy?\n\nBest,\n{{signature}}`
      },
      c: {
        subject: "Re: {{company}} supplier question",
        body: `Hi {{first_name}},\n\nJust bumping this up in case it got buried. No pressure if timing isn't right.\n\nTo add context — one of our US clients increased their margin by 30% after switching to our direct manufacturing model. Happy to share the case study if helpful.\n\nBest,\n{{signature}}`
      }
    };

    let currentEmailIdx = null;

    function openEmailPanel(idx) {
      currentEmailIdx = idx;
      generateEmail();
      document.getElementById('emailPanel').style.display = 'block';
      document.getElementById('emailPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closeEmailPanel() {
      document.getElementById('emailPanel').style.display = 'none';
      currentEmailIdx = null;
    }

    function loadSignature() {
      return {
        name: localStorage.getItem('sigName') || '',
        company: localStorage.getItem('sigCompany') || '',
        phone: localStorage.getItem('sigPhone') || ''
      };
    }

    function saveSignature() {
      localStorage.setItem('sigName', document.getElementById('sigName').value);
      localStorage.setItem('sigCompany', document.getElementById('sigCompany').value);
      localStorage.setItem('sigPhone', document.getElementById('sigPhone').value);
      alert('签名已保存');
    }

    function restoreSignatureInputs() {
      const s = loadSignature();
      document.getElementById('sigName').value = s.name;
      document.getElementById('sigCompany').value = s.company;
      document.getElementById('sigPhone').value = s.phone;
    }

    function generateEmail() {
      if (currentEmailIdx === null) return;
      const lead = window.currentLeads[currentEmailIdx];
      const templateKey = document.getElementById('emailTemplate').value;
      const template = TEMPLATES[templateKey];
      const sig = loadSignature();
      const signature = sig.name
        ? `${sig.name}\n${sig.company}${sig.phone ? '\n' + sig.phone : ''}`
        : '[您的姓名]\n[公司名称]';

      const company = (lead.company || lead.domain || 'your company');
      const firstName = (lead.first_name || 'there');

      document.getElementById('emailSubject').value = template.subject
        .replace(/{{company}}/g, company)
        .replace(/{{first_name}}/g, firstName);

      document.getElementById('emailBody').value = template.body
        .replace(/{{company}}/g, company)
        .replace(/{{first_name}}/g, firstName)
        .replace(/{{signature}}/g, signature);
    }

    function copyEmail() {
      const subject = document.getElementById('emailSubject').value;
      const body = document.getElementById('emailBody').value;
      const text = `Subject: ${subject}\n\n${body}`;
      navigator.clipboard.writeText(text).then(() => alert('邮件已复制到剪贴板'));
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadKeywords() {
      const list = document.getElementById('keywordList');
      try {
        const res = await fetch('/api/keywords');
        const data = await res.json();
        if (!data.keywords || data.keywords.length === 0) {
          list.innerHTML = '<li class="empty-hint">暂无搜索记录</li>';
          return;
        }
        list.innerHTML = '';
        for (const item of data.keywords) {
          const li = document.createElement('li');
          li.innerHTML = `<span class="term">${escapeHtml(item.term)}</span><span class="count">${item.count}</span>`;
          li.addEventListener('click', () => {
            document.getElementById('keyword').value = item.term;
            document.getElementById('keyword').focus();
          });
          list.appendChild(li);
        }
      } catch (err) {
        list.innerHTML = '<li class="empty-hint">加载失败</li>';
      }
    }

    async function markContacted(idx) {
      const lead = window.currentLeads[idx];
      if (!lead) return;
      try {
        const form = new FormData();
        form.append('email', lead.email);
        form.append('domain', lead.domain || '');
        form.append('notes', '');
        const res = await fetch('/api/contacted', { method: 'POST', body: form });
        if (res.ok) {
          const userRes = await fetch('/api/me');
          const user = userRes.ok ? await userRes.json() : { name: '员工' };
          lead.contacted = true;
          lead.contacted_at = new Date().toISOString();
          lead.contacted_by = user.name;
          alert('已标记为联系过');
          renderResult({ total: window.currentLeads.length, preview: window.currentLeads, download_url: window.currentDownloadUrl || '' });
          loadContacted();
        }
      } catch (err) {
        alert('标记失败');
      }
    }

    async function loadContacted() {
      const list = document.getElementById('contactedList');
      if (!list) return;
      try {
        const res = await fetch('/api/contacted');
        const data = await res.json();
        if (!data.items || data.items.length === 0) {
          list.innerHTML = '<li class="empty-hint">暂无记录</li>';
          return;
        }
        list.innerHTML = '';
        for (const item of data.items.slice(0, 20)) {
          const li = document.createElement('li');
          li.innerHTML = `<span class="term">${escapeHtml(item.email)}</span><span class="count">${escapeHtml(item.domain || '')}</span>`;
          list.appendChild(li);
        }
      } catch (err) {
        list.innerHTML = '<li class="empty-hint">加载失败</li>';
      }
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) {
          window.location.href = '/login';
          return;
        }
        const user = await res.json();
        document.getElementById('userName').textContent = user.name || user.user_id;
        document.getElementById('userRole').textContent = user.role === 'admin' ? '管理员' : '业务员';
        document.getElementById('userCard').style.display = 'block';
      } catch (err) {
        window.location.href = '/login';
      }
    }

    async function logout() {
      try {
        await fetch('/logout', { method: 'POST' });
        window.location.href = '/login';
      } catch (err) {
        window.location.href = '/login';
      }
    }

    checkAuth();
    loadKeywords();
    loadContacted();
    restoreSignatureInputs();
  </script>
</body>
</html>
