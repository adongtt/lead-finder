<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — B2B 客户开发工具</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --danger: #f87171;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }
    .subtitle { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 28px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--danger);
      display: none;
    }
    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>B2B 客户开发工具</h1>
    <p class="subtitle">员工登录</p>
    <div id="errorBox" class="error"></div>
    <form id="loginForm">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" placeholder="例如 zhangsan" required autocomplete="username">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
      <button type="submit" id="submitBtn">登录</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '登录中...';

      const formData = new FormData(form);
      try {
        const res = await fetch('/login', { method: 'POST', body: formData });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json();
          errorBox.textContent = data.detail || '登录失败';
          errorBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = '登录';
        }
      } catch (err) {
        errorBox.textContent = '网络错误，请重试';
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
