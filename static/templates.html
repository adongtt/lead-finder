<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索模板 - B2B 客户开发工具</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
    }
    .sidebar h2 { font-size: 18px; margin-bottom: 32px; padding-left: 12px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-item:hover { background: var(--bg); color: var(--text); }
    .nav-item.active { background: #e0f2fe; color: var(--primary); }
    .nav-item.logout { margin-top: auto; color: var(--danger); }
    .nav-item.logout:hover { background: #fef2f2; }

    .main {
      flex: 1;
      margin-left: 220px;
      padding: 28px 32px;
      max-width: calc(100% - 220px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .topbar h1 { font-size: 24px; }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-role { background: var(--bg); color: var(--muted); }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .template-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .template-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1);
    }
    .template-card .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .template-card h3 { font-size: 16px; }
    .template-card .mode-tag {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 500;
    }
    .mode-apollo { background: #e0f2fe; color: #0369a1; }
    .mode-keyword { background: #dcfce7; color: #166534; }
    .mode-maps { background: #fef3c7; color: #92400e; }
    .mode-domains { background: #f3e8ff; color: #7c3aed; }

    .template-card .desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    .template-card .params {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .template-card .param {
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .empty { padding: 40px; text-align: center; color: var(--muted); }

    @media (max-width: 768px) {
      .sidebar { width: 64px; padding: 16px 8px; }
      .sidebar h2 { display: none; }
      .nav-item span:last-child { display: none; }
      .main { margin-left: 64px; max-width: calc(100% - 64px); padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-active="templates"></aside>

    <main class="main">
      <div class="topbar">
        <h1>搜索模板</h1>
        <div class="user-chip">
          <span id="userName">--</span>
          <span id="userRole" class="badge badge-role">--</span>
        </div>
      </div>

      <p style="color:var(--muted);margin-bottom:20px;font-size:14px;">
        点击任意卡片即可跳转到搜索页并自动填入对应参数，减少重复填写。
      </p>

      <div class="template-grid" id="templateGrid"></div>
    </main>
  </div>

  <script src="/static/components/sidebar.js"></script>
  <script>
    const TEMPLATES = [
      {
        id: 'apollo-sports-us',
        title: '美国体育用品经销商',
        mode: 'apollo',
        desc: '通过 Apollo 找美国 2-50 人体育用品公司的采购决策人。',
        params: { mode: 'apollo', apollo_keywords: 'sporting goods', apollo_country: 'United States', apollo_employee_range: '2,50', apollo_titles: 'Buyer,Purchasing Manager,Procurement Manager,Sourcing Manager', scan_supplier_pages: '1' }
      },
      {
        id: 'apollo-football-us',
        title: '美式足球手套经销商',
        mode: 'apollo',
        desc: '锁定美国 football equipment / team apparel 相关公司。',
        params: { mode: 'apollo', apollo_keywords: 'football equipment', apollo_country: 'United States', apollo_employee_range: '2,50', apollo_titles: 'Buyer,Purchasing Manager,Sourcing Manager', scan_supplier_pages: '1' }
      },
      {
        id: 'apollo-baseball-us',
        title: '棒球手套经销商',
        mode: 'apollo',
        desc: '针对美国 baseball equipment / sporting goods 买家。',
        params: { mode: 'apollo', apollo_keywords: 'baseball equipment', apollo_country: 'United States', apollo_employee_range: '2,50', apollo_titles: 'Buyer,Purchasing Manager,Sourcing Manager', scan_supplier_pages: '1' }
      },
      {
        id: 'apollo-work-gloves-eu',
        title: '欧美劳保手套进口商',
        mode: 'apollo',
        desc: '寻找欧美安全用品 / 劳保手套分销商与进口商。',
        params: { mode: 'apollo', apollo_keywords: 'safety gloves', apollo_country: 'United States,Germany,United Kingdom', apollo_employee_range: '2,200', apollo_titles: 'Procurement Manager,Buyer,Sourcing Manager', scan_supplier_pages: '1' }
      },
      {
        id: 'apollo-medical-us',
        title: '美国医疗手套分销商',
        mode: 'apollo',
        desc: '面向美国医疗 / 牙科 / 诊所渠道的丁腈/乳胶手套买家。',
        params: { mode: 'apollo', apollo_keywords: 'medical supplies', apollo_country: 'United States', apollo_employee_range: '2,200', apollo_titles: 'Procurement Manager,Buyer,Supply Chain Manager', scan_supplier_pages: '1' }
      },
      {
        id: 'keyword-football-usa',
        title: 'Google 搜美式足球手套分销商',
        mode: 'keyword',
        desc: '使用关键词搜索发现 Google 上的分销商、进口商。',
        params: { mode: 'keyword', keyword: 'football gloves distributor USA', pages: '20', exclude_big_platforms: '1', strict_mode: '1', target_tld: '.com' }
      },
      {
        id: 'keyword-baseball-usa',
        title: 'Google 搜棒球手套进口商',
        mode: 'keyword',
        desc: '棒球手套 importer / distributor，排除大平台。',
        params: { mode: 'keyword', keyword: 'baseball gloves importer USA', pages: '20', exclude_big_platforms: '1', strict_mode: '1', target_tld: '.com' }
      },
      {
        id: 'keyword-work-gloves-eu',
        title: 'Google 搜劳保手套欧洲',
        mode: 'keyword',
        desc: 'work gloves distributor / safety gloves wholesaler 欧洲市场。',
        params: { mode: 'keyword', keyword: 'work gloves distributor Europe', pages: '20', exclude_big_platforms: '1', strict_mode: '1', target_tld: '.de,.uk,.nl,.fr' }
      },
      {
        id: 'maps-sporting-usa',
        title: 'Google Maps 本地体育用品批发',
        mode: 'google_maps',
        desc: '按地区搜索线下体育用品批发商，保留电话线索。',
        params: { mode: 'google_maps', keyword: 'sporting goods wholesale', maps_region: 'USA', keep_no_email: '1', scan_supplier_pages: '1' }
      },
      {
        id: 'maps-work-gloves-usa',
        title: 'Google Maps 劳保手套供应商',
        mode: 'google_maps',
        desc: '找美国本地 work gloves / safety gloves 供应商。',
        params: { mode: 'google_maps', keyword: 'work gloves supplier', maps_region: 'USA', keep_no_email: '1' }
      },
      {
        id: 'domains-sample',
        title: '批量导入域名挖邮箱',
        mode: 'domains',
        desc: '已有域名列表时使用，可快速挖掘决策人邮箱。',
        params: { mode: 'domains', domains: 'sportsunlimitedinc.com\nrawlings.com\neastbay.com', scan_supplier_pages: '1' }
      },
    ];

    const MODE_LABELS = {
      apollo: { label: 'Apollo', class: 'mode-apollo' },
      keyword: { label: '关键词', class: 'mode-keyword' },
      google_maps: { label: 'Google Maps', class: 'mode-maps' },
      domains: { label: '批量域名', class: 'mode-domains' },
    };

    function renderTemplates() {
      const grid = document.getElementById('templateGrid');
      grid.innerHTML = TEMPLATES.map(t => {
        const m = MODE_LABELS[t.mode] || { label: t.mode, class: 'mode-keyword' };
        const paramTags = Object.entries(t.params).filter(([k]) => !['mode'].includes(k)).slice(0, 4).map(([k, v]) => {
          const short = v.length > 24 ? v.slice(0, 24) + '...' : v;
          return `<span class="param">${k}: ${escapeHtml(short)}</span>`;
        }).join('');
        return `
          <div class="template-card" onclick="useTemplate('${t.id}')">
            <div class="header">
              <h3>${escapeHtml(t.title)}</h3>
              <span class="mode-tag ${m.class}">${m.label}</span>
            </div>
            <div class="desc">${escapeHtml(t.desc)}</div>
            <div class="params">${paramTags}</div>
          </div>
        `;
      }).join('');
    }

    function useTemplate(id) {
      const t = TEMPLATES.find(x => x.id === id);
      if (!t) return;
      const params = new URLSearchParams();
      Object.entries(t.params).forEach(([k, v]) => params.set(k, v));
      window.location.href = '/?' + params.toString();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) { window.location.href = '/login'; return; }
        const user = await res.json();
        document.getElementById('userName').textContent = user.name || user.user_id;
        document.getElementById('userRole').textContent = user.role === 'admin' ? '管理员' : '业务员';
      } catch (err) {
        window.location.href = '/login';
      }
    }

    async function logout() {
      try { await fetch('/logout', { method: 'POST' }); } catch (e) {}
      window.location.href = '/login';
    }

    checkAuth().then(() => renderTemplates());
  </script>
</body>
</html>
